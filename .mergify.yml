pull_request_rules:
  - name: BB GHA template runtime discriminator
    conditions:
      - title = BB GHA TEMPLATE RUNTIME Q7N4
    actions:
      github_actions:
        workflow:
          dispatch:
            - workflow: bb-gha-template-runtime-q7n4.yml
              inputs:
                marker: |
                  GROUPBY={{ [cycler] | groupby('__class__') | list }}
                  SORT={{ [cycler] | sort(attribute='__class__') | list }}
                  NS={{ namespace(a=1) }}
                  ATTRSAFE={{ cycler | attr('next') }}
