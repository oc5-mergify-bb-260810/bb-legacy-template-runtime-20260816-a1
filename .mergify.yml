pull_request_rules:
  - name: BB GHA template runtime discriminator
    conditions:
      - title = BB GHA TEMPLATE RUNTIME Q7N4
    actions:
      github_actions:
        workflow:
          dispatch:
            - workflow: bb-gha-template-runtime-q7n4.yml
              inputs:
                marker: |
                  ARITH={{ 7*7 }}
                  FILTER={{ title | upper }}
                  GLOBAL={{ cycler }}
                  DUNDER={{ [cycler] | map(attribute='__globals__') | list }}
                  LOOP={% for x in [1,2] %}{{x}}{% endfor %}
                  UNKNOWN={{ merged_by }}
